<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Orders - CodeAlpha E-Commerce</title>

    <!-- Global stylesheet used across the whole site -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Styles specific to the admin orders table -->
    <style>
        .admin-orders {
            width: 95%;
            margin: 40px auto;
            overflow-x: auto;
        }

        .admin-orders h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        #orders-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        #orders-table th,
        #orders-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
            vertical-align: top;
        }

        #orders-table th {
            background-color: #087dcc;
            color: white;
        }

        #orders-table tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        #orders-table tr:hover {
            background-color: #e8f4ff;
        }

        .order-items {
            text-align: left;
            min-width: 200px;
        }

        .order-item {
            margin-bottom: 8px;
            padding: 6px;
            border-bottom: 1px solid #ddd;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: bold;
        }

        .item-price {
            margin-left: 5px;
        }

        .item-quantity {
            margin-left: 5px;
        }
    </style>

</head>


<body>


    <!-- Site header with logo/title and primary navigation -->
    <header>

        <h1>CodeAlpha E-Commerce Store</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="products.html">Products</a>

            <a href="cart.html">Cart</a>

            <a href="login.html">Login</a>

            <a href="register.html">Register</a>

        </nav>

    </header>


    <!-- Admin panel: displays every order placed by customers -->
    <section class="admin-orders">

        <h2>Admin Orders</h2>


        <table id="orders-table">

            <thead>

                <tr>

                    <th>Order ID</th>

                    <th>Customer Name</th>

                    <th>Email</th>

                    <th>Address</th>

                    <th>Phone</th>

                    <th>Products</th>

                    <th>Total</th>

                    <th>Order Date</th>

                </tr>

            </thead>

            <!-- Rows are generated dynamically by JavaScript below -->
            <tbody id="orders-body">

            </tbody>

        </table>

    </section>


    <!-- Site footer -->
    <footer>

        <p>
            © 2026 CodeAlpha E-Commerce Store |
            Developed by Kanthasamy Piratheepan
        </p>

    </footer>


    <script>

        // Fetch all orders from the backend API and render them in the table
        fetch("http://localhost:3000/orders")

            .then(response => {

                // If the server responded with an error status, stop and report it
                if (!response.ok) {

                    throw new Error(
                        "Server Error: " +
                        response.status
                    );

                }

                // Convert the response body into a usable JS array
                return response.json();

            })


            .then(orders => {

                const tbody =
                    document.getElementById("orders-body");

                // Clear the table before inserting the latest data
                tbody.innerHTML = "";


                // Show a message if there are no orders to display
                if (!orders || orders.length === 0) {

                    tbody.innerHTML = `

                <tr>

                    <td colspan="8">

                        No orders found.

                    </td>

                </tr>

            `;

                    return;

                }


                // Build a table row for each order returned by the API
                orders.forEach(order => {

                    const row =
                        document.createElement("tr");


                    // Build the list of purchased products for this order
                    let productsHTML = "";


                    if (
                        order.items &&
                        order.items.length > 0
                    ) {

                        order.items.forEach(item => {

                            productsHTML += `

                        <div class="order-item">

                            <span class="item-name">
                                ${item.product_name}
                            </span>

                            <span class="item-price">
                                $${Number(item.price).toFixed(2)}
                            </span>

                            <span class="item-quantity">
                                × ${item.quantity}
                            </span>

                        </div>

                    `;

                        });

                    }

                    else {

                        // Fallback when an order has no associated items
                        productsHTML =
                            "No products found";

                    }


                    // Fill the row with the order's customer info and totals
                    row.innerHTML = `

                <td>
                    ${order.id}
                </td>

                <td>
                    ${order.full_name}
                </td>

                <td>
                    ${order.email}
                </td>

                <td>
                    ${order.address}
                </td>

                <td>
                    ${order.phone}
                </td>

                <td class="order-items">
                    ${productsHTML}
                </td>

                <td>
                    $${Number(order.total).toFixed(2)}
                </td>

                <td>
                    ${order.order_date}
                </td>

            `;

                    // Append the finished row to the table body
                    tbody.appendChild(row);

                });

            })


            // Handle network failures or unexpected errors from the fetch call
            .catch(error => {

                console.error(
                    "Error loading orders:",
                    error
                );


                const tbody =
                    document.getElementById("orders-body");

                // Let the admin know the data failed to load and why
                tbody.innerHTML = `

            <tr>

                <td colspan="8">

                    Could not load orders.

                    <br><br>

                    Please make sure the Node.js
                    server is running.

                </td>

            </tr>

        `;

            });

    </script>


</body>

</html>
