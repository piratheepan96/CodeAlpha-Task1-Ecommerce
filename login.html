<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CodeAlpha E-Commerce Store</title>

    <!-- Global stylesheet used across the whole site -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Site header with logo/title and primary navigation -->
    <header>

        <h1>CodeAlpha E-Commerce Store</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="products.html">Products</a>

            <a href="cart.html">Cart</a>

            <a href="login.html">Login</a>

            <a href="register.html">Register</a>

        </nav>

    </header>


    <!-- Login section: authenticates an existing user -->
    <section class="login-container">

        <h2>User Login</h2>

        <form id="login-form">

            <!-- User's registered email address -->
            <input type="email" id="email" name="email" placeholder="Enter Email" required>

            <!-- User's account password -->
            <input type="password" id="password" name="password" placeholder="Enter Password" required>

            <button type="submit">
                Login
            </button>

        </form>

    </section>


    <!-- Site footer -->
    <footer>

        <p>
            © 2026 CodeAlpha E-Commerce Store |
            Developed by Kanthasamy Piratheepan
        </p>

    </footer>


    <!-- Handles login form submission and communication with the backend -->
    <script>

        const loginForm =
            document.getElementById("login-form");


        loginForm.addEventListener(
            "submit",
            async function (event) {

                // Stop the default full-page form submission
                event.preventDefault();


                // Get email
                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                // Get password
                const password =
                    document
                        .getElementById("password")
                        .value;


                // Make sure both fields are filled before contacting the server
                if (!email || !password) {

                    alert(
                        "Please enter email and password."
                    );

                    return;
                }


                try {

                    // Send the login credentials to the Node.js/Express backend
                    const response =
                        await fetch(
                            "http://localhost:3000/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    email: email,

                                    password: password

                                })
                            }
                        );


                    // Parse the JSON response returned by the server
                    const data =
                        await response.json();


                    console.log(
                        "Login Response:",
                        data
                    );


                    // If the server rejected the request, show the returned error
                    if (!response.ok) {

                        alert(
                            data.message ||
                            "Invalid email or password."
                        );

                        return;
                    }


                    // Login succeeded
                    alert(
                        "Login successful!"
                    );


                    // Persist the logged-in user's data locally for the session
                    localStorage.setItem(
                        "loggedInUser",
                        JSON.stringify(data.user)
                    );


                    // Redirect back to the homepage
                    window.location.href =
                        "index.html";

                }


                catch (error) {

                    // Handle cases where the server is unreachable
                    console.error(
                        "Login Error:",
                        error
                    );


                    alert(
                        "Server connection failed.\n\n" +
                        "Please make sure Node.js server is running."
                    );

                }

            });

    </script>


</body>

</html>
