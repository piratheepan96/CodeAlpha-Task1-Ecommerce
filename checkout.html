<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - CodeAlpha E-Commerce</title>
    <!-- Global stylesheet used across the whole site -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Site header with logo/title and primary navigation -->
<header>
    <h1>CodeAlpha E-Commerce Store</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>
<!-- Checkout section: collects customer details and confirms the order -->
<section class="checkout-container">
    <h2>Checkout</h2>
    <!-- Order form, submitted via script.js to place the order -->
    <form id="checkout-form">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="address">Address</label>
        <textarea id="address" name="address" required></textarea>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" required>

        <!-- Order total, populated dynamically from the cart -->
        <h3>Order Total: $<span id="checkout-total">0</span></h3>

        <button type="submit">Place Order</button>
    </form>
</section>
<!-- Site footer -->
<footer>
    <p>© 2026 CodeAlpha E-Commerce Store | Developed by Kanthasamy Piratheepan</p>
</footer>
<!-- Handles form submission, order total calculation, and order placement -->
<script src="js/script.js"></script>
</body>
</html>
