<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CodeAlpha E-Commerce Store</title>

    <!-- Global stylesheet used across the whole site -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Site header with logo/title and primary navigation -->
    <header>

        <h1>CodeAlpha E-Commerce Store</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="products.html">Products</a>

            <a href="cart.html">Cart</a>

            <a href="login.html">Login</a>

            <a href="register.html">Register</a>

        </nav>

    </header>


    <!-- Registration section: creates a new user account -->
    <section class="login-container">

        <h2>Create Account</h2>

        <form id="register-form">

            <!-- Full Name -->
            <input type="text" id="fullName" name="fullName" placeholder="Full Name" required>

            <!-- Email -->
            <input type="email" id="email" name="email" placeholder="Email Address" required>

            <!-- Password -->
            <input type="password" id="password" name="password" placeholder="Password" required>

            <!-- Confirm Password -->
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>

            <button type="submit">
                Register
            </button>

        </form>

    </section>


    <!-- Site footer -->
    <footer>

        <p>
            © 2026 CodeAlpha E-Commerce Store |
            Developed by Kanthasamy Piratheepan
        </p>

    </footer>


    <!-- Handles registration form submission and communication with the backend -->
    <script>

        const registerForm =
            document.getElementById("register-form");


        registerForm.addEventListener(
            "submit",
            async function (event) {

                // Prevent the default full-page form submission
                event.preventDefault();


                // Get form values
                const fullName =
                    document
                        .getElementById("fullName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                // Make sure no required field was left empty
                if (
                    !fullName ||
                    !email ||
                    !password ||
                    !confirmPassword
                ) {

                    alert(
                        "Please fill in all fields."
                    );

                    return;
                }


                // Make sure the password and confirmation match
                if (
                    password !==
                    confirmPassword
                ) {

                    alert(
                        "Passwords do not match."
                    );

                    return;
                }


                try {

                    // Send the new account details to the Node.js/Express backend
                    const response =
                        await fetch(
                            "http://localhost:3000/register",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        fullName:
                                            fullName,

                                        email:
                                            email,

                                        password:
                                            password

                                    })

                            }
                        );


                    // Parse the JSON response returned by the server
                    const data =
                        await response.json();


                    // If the server rejected the request, show the returned error
                    if (!response.ok) {

                        alert(
                            data.message ||
                            "Registration failed."
                        );

                        return;
                    }


                    // Registration succeeded
                    alert(
                        "Registration successful!"
                    );


                    // Reset the form fields
                    registerForm.reset();


                    // Redirect the new user to the login page
                    window.location.href =
                        "login.html";

                }


                catch (error) {

                    // Handle cases where the server is unreachable
                    console.error(
                        "Registration Error:",
                        error
                    );


                    alert(
                        "Server connection failed.\n\n" +
                        "Please make sure Node.js server is running."
                    );

                }

            }
        );

    </script>

</body>

</html>
